staging:
  # This step is meant to run the minifile tests. 
  type: test
  script:
  - eval `/home/cew/bin/checkout-fudge-s8-bash --fudgetag cew-dev`
  - source /home/cew/Code/FUDGE_regtests/reg_config_file_bash
  #The below does not work. Calling entire thing, rather than alias.
  #- alias run_regtests="python /home/cew/Code/FUDGE_regtests/run_fudge_regtests.py"
  - datestr=`date +%Y%m%d-%H%M`
  - summfile="${TMPDIR}/${FUDGETAG}_${datestr}.txt"
  - python /home/cew/Code/FUDGE_regtests/run_fudge_regtests.py -i /home/cew/Code/FUDGE_regtests/sample_mini_xml.txt --runtemp --summary_file $summfile --regtest
  only:
  - tags,master,i_gitlab-ci

