#Setting up automatic deployment of regression tests
test:
  script:
  # This does the environment setup and the checking out of a new branch
  - source /usr/local/Modules/3.1.6/init/bash
  - module use -a /home/esd/local/modulefiles
  - module purge
  - module load esd/env
  - eval `checkout-fudge-s8-bash --fudgetag ${CI_COMMIT_SHA}`
  - source /home/cew/Code/FUDGE_regtests/reg_config_file
  - alias run_regtests="python /home/cew/Code/FUDGE_regtests/run_fudge_regtests.py"

staging:
  # This step is meant to run the minifile tests. 
  type: test
  script:
  - datestr=`date +%Y%m%d-%H%M`
  - summfile="${TMPDIR}/${FUDGETAG}_${datestr}.txt"
  - run_regtests -i /home/cew/Code/FUDGE_regtests/sample_mini_xml.txt --runtemp --summary_file $summfile --regtest
  only:
  - tags,master

production:
  type: test
  script:
  - datestr=`date +%Y%m%d-%H%M`
  - summfile="${TMPDIR}/${FUDGETAG}_${datestr}.txt"
  - run_regtests -i /home/cew/Code/FUDGE_regtests/full_xml.txt --runtemp --summary_file $summfile --regtest
  only:
  - master

